<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management — weave.ing</title>

    <link rel="stylesheet"
          th:href="@{/assets/css/admin-dashboard.css}">

    <link rel="stylesheet" th:href="@{/assets/css/confirmation.css}">
</head>


<body>


<!-- ============================================================
     ADMIN NAVBAR
     ============================================================ -->

<nav class="admin-nav">

    <div class="nav-left">

        <a th:href="@{/home}"
           class="logo">
            <img th:src="@{/assets/images/logo.png}" alt="weave.ing" class="site-logo-image">
        </a>

    </div>


    <div class="nav-right">

        <a th:href="@{/admin}"
           class="marketplace-link">

            ← Admin Dashboard

        </a>

        <span class="admin-badge">
            ADMIN
        </span>


        <form th:action="@{/logout}"
              method="post"
              data-confirm="Log out of weave.ing?"
              data-confirm-title="Log out?"
              data-confirm-accept="Log out">

            <button type="submit"
                    class="logout-button">

                Log out

            </button>

        </form>

    </div>

</nav>



<!-- ============================================================
     MAIN
     ============================================================ -->

<main class="admin-main">


    <section class="admin-heading">

        <p class="eyebrow">
            ACCOUNT MANAGEMENT
        </p>

        <h1>
            User Management
        </h1>

        <p>
            View the accounts currently registered on weave.ing.
        </p>

    </section>



    <!-- USER LIST -->

    <section class="admin-section">


        <div class="compact-list">


            <div class="compact-card"
                 th:each="user : ${users}">


                <div>

                    <strong th:text="${user.name}">
                        User Name
                    </strong>

                    <span>

                        @<span th:text="${user.username}">
                            username
                        </span>

                        ·

                        <span th:text="${user.email}">
                            email
                        </span>

                    </span>

                </div>


                <span th:if="${user.admin}"
                      class="status approved">

                    ADMIN

                </span>


                <span th:unless="${user.admin}"
                      class="status pending">

                    USER

                </span>


            </div>


        </div>

    </section>


</main>

<script th:src="@{/assets/js/confirmation.js}"></script>
</body>

</html>
