<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Weave.ing</title>
</head>

<body>

<h1>Login to Weave.ing</h1>

<div th:if="${param.error}">
    <p>Invalid email or password.</p>
</div>

<div th:if="${param.logout}">
    <p>You have been logged out.</p>
</div>

<form th:action="@{/login}" method="post">

    <div class="field">
        <input
                type="email"
                id="loginEmail"
                name="username"
                placeholder=" "
                required>

        <label for="loginEmail">
            Email
        </label>
    </div>

    <div class="field">
        <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder=" "
                required
                minlength="6">

        <label for="loginPassword">
            Password
        </label>
    </div>

    <p class="field-hint error"
       th:if="${param.error}">
        Invalid email or password.
    </p>

    <p class="field-hint"
       th:if="${param.logout}">
        You have been logged out.
    </p>

    <button
            type="submit"
            class="btn btn-primary auth-submit">
        Log In
    </button>

</form>

<br>

<a href="/signup">Don't have an account? Sign up</a>

</body>

</html>
