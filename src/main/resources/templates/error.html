<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — weave.ing</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5EFE8;
            color: #1A1A1A;
            font-family: Arial, sans-serif;
        }

        .error-box {
            width: min(90%, 520px);
            padding: 42px 32px;
            text-align: center;
            background: #FDFAF7;
            border: 1px solid #D9CDBE;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(74, 56, 48, 0.10);
        }

        h1 {
            margin: 0 0 10px;
            color: #634D40;
            font-size: 42px;
        }

        h2 {
            margin: 0 0 14px;
            color: #4a3830;
            font-size: 22px;
        }

        p {
            margin: 0 0 24px;
            color: #7a6b60;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 10px;
            background: #634D40;
            color: white;
            text-decoration: none;
        }

        a:hover {
            background: #4a3830;
        }
    </style>
</head>
<body>
<div class="error-box">
    <h1 th:text="${status}">500</h1>
    <h2 th:text="${error}">Something went wrong</h2>
    <p th:text="${message}">
        Something went wrong. Please try again.
    </p>
    <a th:href="@{/home}">Back to Home</a>
</div>
</body>
</html>
