<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — weave.ing</title>
    <link rel="stylesheet" th:href="@{/assets/css/site-layout.css}">
    <style>
        .notifications-page {
            width: min(92%, 900px);
            margin: 118px auto 70px;
        }

        .notifications-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 26px;
        }

        .notifications-heading h1 {
            margin: 0;
            color: var(--brown-dark);
        }

        .notifications-heading p {
            margin: 7px 0 0;
            color: var(--muted);
        }

        .notifications-list {
            display: grid;
            gap: 12px;
        }

        .notification-item {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--white);
            box-shadow: var(--shadow-soft);
        }

        .notification-item.unread {
            background: var(--beige-light);
            border-color: var(--beige-dark);
        }

        .notification-open {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 42px 1fr;
            align-items: center;
            gap: 16px;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .notification-open:hover h3 {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .notification-item-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--beige-mid);
            color: var(--brown-dark);
        }

        .notification-item-icon svg {
            width: 20px;
            height: 20px;
        }

        .notification-item h3 {
            margin: 0 0 5px;
            color: var(--brown-dark);
            font-size: 1rem;
        }

        .notification-item p {
            margin: 0;
            color: var(--muted);
            font-size: .88rem;
            line-height: 1.55;
        }

        .notification-time {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: .75rem;
        }

        .notification-read-button {
            border: 0;
            background: transparent;
            color: var(--brown);
            font: inherit;
            font-size: .78rem;
            font-weight: 700;
            cursor: pointer;
        }

        .notification-empty {
            padding: 42px 20px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--white);
            color: var(--muted);
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .notifications-mark-all {
            border: 0;
            background: transparent;
            color: var(--brown);
            font: inherit;
            font-size: .82rem;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .notifications-page {
                margin-top: 100px;
            }

            .notifications-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .notification-item {
                grid-template-columns: 1fr;
            }

            .notification-open {
                grid-column: 1;
                grid-template-columns: 38px 1fr;
            }

            .notification-read-button {
                grid-column: 1;
                justify-self: start;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/site-layout :: siteHeader}"></div>

<main class="notifications-page">

    <div class="notifications-heading">
        <div>
            <h1>Notifications</h1>
            <p>Your latest weave.ing activity and account updates.</p>
        </div>

        <form th:if="${!notifications.isEmpty()}"
              th:action="@{/notifications/read-all}"
              method="post">
            <button type="submit" class="notifications-mark-all">
                Mark all as read
            </button>
        </form>
    </div>

    <div class="notifications-list"
         th:if="${!notifications.isEmpty()}">

        <article th:each="notification : ${notifications}"
                 class="notification-item"
                 th:classappend="${!notification.read} ? ' unread' : ''">

            <a class="notification-open"
               th:href="@{/notifications/{id}/open(id=${notification.id})}"
               th:aria-label="'Open notification: ' + ${notification.title}">

                <div class="notification-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                        <path d="M10 21h4"/>
                    </svg>
                </div>

                <div>
                    <h3 th:text="${notification.title}">Notification title</h3>
                    <p th:text="${notification.message}">Notification message</p>
                    <span class="notification-time"
                          th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy · HH:mm')}">
                        20 Sep 2026 · 12:00
                    </span>
                </div>

            </a>

            <form th:if="${!notification.read}"
                  th:action="@{'/notifications/' + ${notification.id} + '/read'}"
                  method="post">
                <button type="submit" class="notification-read-button">
                    Mark read
                </button>
            </form>

        </article>

    </div>

    <div class="notification-empty"
         th:if="${notifications.isEmpty()}">
        You are all caught up. New weave.ing updates will appear here.
    </div>

</main>

<div th:replace="~{fragments/site-layout :: siteFooter}"></div>

</body>
</html>
